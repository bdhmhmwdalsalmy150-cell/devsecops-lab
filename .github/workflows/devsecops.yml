name: DevSecOps Pipeline
on: [push]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: SAST with SonarQube
        uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e # master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=bdhmhmwdalsalmy150-cell_devsecops-lab
            -Dsonar.organization=bdhmhmwdalsalmy150-cell

      - name: Scan dependencies with Snyk
        uses: snyk/actions/python@11b673cfb4b0dc0d860a1323caa199d54950dcce # master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Build Docker image
        run: docker build -t myapp:latest .

      - name: Container scanning with Trivy
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # master
        with:
          image-ref: 'myapp:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
